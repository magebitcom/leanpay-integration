name: docs-health
on:
  pull_request:
    branches: [staging, master]
jobs:
  docs-health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Without full history there is no merge base to diff against.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: sh docs/.health-checker/run --base=origin/${{ github.base_ref }}
